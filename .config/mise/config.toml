[settings]
experimental = true # enable experimental features

[settings.github]
credential_command = "gh auth token --hostname github.com"

[tools]
go = "latest"
starship = "latest"
direnv = "latest"
atuin = "latest"
"github:atuinsh/atuin" = { version = "latest", os = ["linux"], asset_pattern = "atuin-server-x86_64-unknown-linux-gnu.tar.gz" }
