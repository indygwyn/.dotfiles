vivid = "latest"
eza = "latest"
crystal = "latest"
java = "graalvm-community-25"
lua = "latest"
node = "latest"
ruby = "latest"
rust = "latest"
shellcheck = "latest"
shellspec = "latest"
shfmt = "latest"
jq = "latest"
bun = "latest"
deno = "latest"
erlang = "latest"
awscli = "latest"
pkl = "latest"
hk = "latest"
"github:anomalyco/opencode" = "latest"
python = "latest"
uv = "latest"
syncthing = "latest"
"pipx:mnemosyne-memory" = { version = "latest", extras = "all" }
pi = "latest"
"pipx:llm" = "latest"
"pipx:datasette" = "latest"
"pipx:black" = "latest"
"pipx:pytest" = "latest"
